name: Xcode - Build

on: 
  push:
  pull_request:

jobs:
  build:
    name: Build using xcodebuild command
    runs-on: macos-latest
    env:
      scheme: SealBox
      archive_path: archive
    outputs:
      scheme: ${{ steps.scheme.outputs.scheme }}
      archive_path: ${{ env.archive_path }}
      artifact: ${{ env.scheme }}.ipa
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Checkout
        uses: actions/checkout@v6
      - name: Fetch submodules
        run: |
          git clone https://github.com/krzyzanowskim/OpenSSL.git OpenSSL
          git -C OpenSSL checkout 623c84da314e85363236507ca38a4bde65df21c3
          git clone https://github.com/LiveContainer/litehook.git litehook
          git -C litehook checkout a7e9f599d7f0b3d77008ad62bf10cb10dab6eca9
      - name: Set Scheme
        id: scheme
        run: |
          if [ $scheme = default ]
          then
            scheme_list=$(xcodebuild -list -json | tr -d "\n")
            scheme=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
            echo Using default scheme: $scheme
          else
            echo Using configured scheme: $scheme
          fi
          echo "scheme=$scheme" >> $GITHUB_OUTPUT
      - name: Set filetype_parameter
        id: filetype_parameter
        run: |
          filetype_parameter=`ls -A | grep -i \.xcworkspace\$ && echo workspace || echo project`
          echo "filetype_parameter=$filetype_parameter" >> $GITHUB_OUTPUT
      - name: Set file_to_build
        id: file_to_build
        run: |
          file_to_build=`ls -A | grep -i \.xcworkspace\$ || ls -A | grep -i \.xcodeproj\$`
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          echo "file_to_build=$file_to_build" >> $GITHUB_OUTPUT
      - name: Archive
        env:
          scheme: ${{ steps.scheme.outputs.scheme }}
          filetype_parameter: ${{ steps.filetype_parameter.outputs.filetype_parameter }}
          file_to_build: ${{ steps.file_to_build.outputs.file_to_build }}
        run: xcodebuild archive -archivePath "$archive_path" -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -sdk iphoneos -arch arm64 -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild-raw.log | xcpretty; exit ${PIPESTATUS[0]}
      - name: Sign app with CI identity
        run: |
          set -e
          APP="$archive_path.xcarchive/Products/Applications/$scheme.app"
          KEYCHAIN="$RUNNER_TEMP/sealbox-ci.keychain-db"
          # Self-signed code-signing identity (CI-only; Seal re-signs with the user's cert on device)
          security create-keychain -p "sealbox-ci" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "sealbox-ci" "$KEYCHAIN"
          printf '%s\n' '[req]' 'distinguished_name=dn' 'prompt=no' 'x509_extensions=v3' '[dn]' 'CN=SealBox CI' '[v3]' 'basicConstraints=critical,CA:FALSE' 'keyUsage=critical,digitalSignature' 'extendedKeyUsage=critical,codeSigning' > "$RUNNER_TEMP/ci-cert.cnf"
          openssl req -x509 -newkey rsa:2048 -keyout "$RUNNER_TEMP/ci-key.pem" -out "$RUNNER_TEMP/ci-cert.pem" -days 365 -nodes -config "$RUNNER_TEMP/ci-cert.cnf"
          openssl pkcs12 -export -out "$RUNNER_TEMP/ci-cert.p12" -inkey "$RUNNER_TEMP/ci-key.pem" -in "$RUNNER_TEMP/ci-cert.pem" -passout pass:sealbox-ci -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1
          security import "$RUNNER_TEMP/ci-cert.p12" -k "$KEYCHAIN" -P "sealbox-ci" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "sealbox-ci" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Expand entitlements.xml build variables (Release: team AAAAA11111, no suffix)
          sed -e 's/$(DEVELOPMENT_TEAM)/AAAAA11111/g' -e 's/$(APP_GROUP_SEALBOX)/group.com.mjorb.sealbox/g' -e 's/$(PRODUCT_BUNDLE_IDENTIFIER)/com.mjorb.sealbox/g' -e 's/$(AppIdentifierPrefix)/AAAAA11111./g' entitlements.xml > "$RUNNER_TEMP/entitlements-expanded.plist"
          plutil -lint "$RUNNER_TEMP/entitlements-expanded.plist"
          /usr/bin/codesign --force --sign "SealBox CI" --entitlements "$RUNNER_TEMP/entitlements-expanded.plist" --timestamp=none --deep "$APP"
          /usr/bin/codesign --verify --deep "$APP"
      - name: Upload raw build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-raw.log
          path: xcodebuild-raw.log
      - name: Verify app entitlements
        run: |
          python3 .github/verify_entitlements.py "$archive_path.xcarchive/Products/Applications/$scheme.app"
      - name: Tar Build Artifact
        run: tar -cvf "$archive_path.xcarchive.tar" "$archive_path.xcarchive"
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.archive_path }}.xcarchive.tar
          path: ${{ env.archive_path }}.xcarchive.tar
      - name: Create IPA
        run: |
          sh .github/build_github.sh

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.scheme }}.ipa
          path: ${{ env.scheme }}.ipa
